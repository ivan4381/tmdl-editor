        const cancelled = ctrl.signal.aborted && doneQ < p.length;
        clear(body);
        body.append(
          h('div', { class: filled ? 'banner ok' : 'banner warn' },
            h('strong', { text: `${fmt(filled)} deskripsi diisi AI.` }),
            cancelled ? ' Proses dihentikan sebelum selesai.' : '',
            skipped ? ` ${fmt(skipped)} dilewati karena Anda mengubahnya selama proses.` : '',
            failed ? ` ${fmt(failed)} gagal.` : ''),
          h('ul', { class: 'small-list', hidden: errors.size === 0 }, [...errors].map((m) => h('li', { text: m }))),
          h('p', { class: 'muted', text: 'Saran AI ditandai ✨. Periksa dan sunting bila perlu sebelum Copy ke Power BI.' }),
          h('div', { class: 'actions' }, h('button', { type: 'button', class: 'btn primary', id: 'aim-done', text: 'Tutup', onclick: close })));
      }

      optionsStep();
      return body;
    });
  }

  // ---------- Power Query refactor (separate artefact, never written to TMDL) ----------
  /**
   * @param {import('../core/mquery.js').MQuery} query
   * @param {'id'|'en'} lang
   * @param {AbortSignal} signal
   */
  async function runRefactor(query, lang, signal) {
    const doc = app.doc();
    const { user, restore } = buildRefactorMessage(query, { mask: ai.maskM, businessContext: ai.context });
    const res = await chatJson(ai.keys, ai.model, refactorSystemPrompt(lang), user, {
      signal, maxTokens: 16000, schema: SCHEMAS.refactor, effort: 'medium', allowThinking: true,
    });
    const parsed = parseRefactorResponse(res.text);
    if (!parsed.code) throw new AiError('other', 'AI tidak mengembalikan kode refactor. Coba lagi atau pilih model lain.');
    const main = unmask(parsed.code, restore);
    const alt = unmask(parsed.alternative, restore);
    const queryNames = new Set(doc.queries.filter((q) => q.key !== query.key).map((q) => (q.kind === 'partition' ? q.table : q.name)));
    return {
      code: main.code,
      alternative: alt.code,
      explanation: parsed.explanation,
      lang,
      model: modelLabel(),
      at: Date.now(),
      masked: restore.size,
      analysis: analyzeRefactor(query.code, main.code, { queryNames, leftPlaceholders: main.left }),
      altAnalysis: alt.code ? analyzeRefactor(query.code, alt.code, { queryNames, leftPlaceholders: alt.left }) : null,
    };
  }

  /**
   * Dialog: choose the comment language and run the refactor for one query.
   * @param {import('../core/mquery.js').MQuery} query
   * @param {()=>void} onDone called after the result is stored in doc.refactors
   */
  function openRefactor(query, onDone) {
    if (!ensureReady(() => openRefactor(query, onDone))) return;
    const doc = app.doc();
    openModal('Refactor dengan AI: ' + queryLabel(query), (close) => {
      const body = h('div');
      const langId = /** @type {HTMLInputElement} */ (h('input', { type: 'radio', name: 'rf-lang', id: 'rf-lang-id', value: 'id' }));
      const langEn = /** @type {HTMLInputElement} */ (h('input', { type: 'radio', name: 'rf-lang', id: 'rf-lang-en', value: 'en' }));
      (ai.lang === 'en' ? langEn : langId).checked = true;
      const runBtn = h('button', { type: 'button', class: 'btn primary', id: 'rf-run', text: 'Jalankan' });

      const options = (error) => {
        clear(body);
        body.append(
          error ? h('div', { class: 'banner error', text: error }) : '',
          h('p', { class: 'muted', text: 'AI menulis ulang kode M query ini supaya lebih mudah dibaca: nama step yang jelas, komentar di setiap step, ringkasan query, dan catatan risiko kualitas data. Hasilnya tampil di sub-tab "Hasil refactor" dan tidak mengubah script TMDL; Anda sendiri yang menempelkannya di Power Query.' }),
          h('div', { class: 'field' }, h('span', { text: 'Bahasa komentar' }),
            h('label', { class: 'check', for: 'rf-lang-id' }, langId, ' Bahasa Indonesia'),
            h('label', { class: 'check', for: 'rf-lang-en' }, langEn, ' English')),
          h('p', { class: 'muted small' }, 'Model: ', h('strong', { text: modelLabel() }),
            ai.maskM ? ' · URL/server/path disensor saat dikirim, lalu dikembalikan di hasil' : ' · kode M dikirim tanpa sensor', ' · ',
            h('button', { type: 'button', class: 'link-btn', text: 'ubah pengaturan AI', onclick: () => openSettings(() => openRefactor(query, onDone)) })),
          h('div', { class: 'actions' }, runBtn, h('button', { type: 'button', class: 'btn ghost', text: 'Batal', onclick: close })));
      };

      runBtn.addEventListener('click', async () => {
        const lang = langEn.checked ? 'en' : 'id';
        const ctrl = new AbortController();
        clear(body);
        body.append(
          h('div', { class: 'progress-bar wide indeterminate' }, h('span')),
          h('p', { class: 'ai-progress-text', id: 'rf-progress', text: `Me-refactor ${queryLabel(query)} dengan ${modelLabel()}… Ini bisa memakan waktu hingga beberapa menit untuk query panjang.` }),
          h('div', { class: 'actions' }, h('button', { type: 'button', class: 'btn', text: 'Batalkan', onclick: () => ctrl.abort() })));
        ai.running = true;
        try {
          const result = await runRefactor(query, lang, ctrl.signal);
          if (!doc.refactors) doc.refactors = new Map();
          doc.refactors.set(query.key, result);
          ai.running = false;
          close();
          toast('Refactor selesai: ' + queryLabel(query), 'ok');
          onDone();
        } catch (e) {
          ai.running = false;
          if (ctrl.signal.aborted) {
            options('Dibatalkan.');
            return;
          }
          options(e instanceof AiError ? e.message : 'Refactor gagal: ' + (e && e.message));
        }
      });

      options('');
      return body;
    });
  }

  return { openSettings, suggestOne, openBulk, suggestM, openBulkM, openRefactor, isReady: ready };
}

exports.initAi = initAi;
});

__def("core/classify.js", function (exports) {
// Sidebar grouping by naming convention and model metadata. Pure functions.

/** Groups of the "Tabel, kolom & measure" sidebar, in display order. */
const TABLE_GROUPS = [
  ['special', 'Special Table'],
  ['fact', 'Fact Table'],
  ['dim', 'Dimension Table'],
  ['other', 'Lainnya'],
];

/** Groups of the Power Query sidebar, in display order. */
const QUERY_GROUPS = [
  ['special', 'Special Table'],
  ['fact', 'Fact Table'],
  ['dim', 'Dimension Table'],
  ['staging', 'Staging'],
  ['other', 'Lainnya'],
  ['fnparam', 'Fungsi & Parameter'],
];

/**
 * True when `name` starts with `word` (case-insensitive) used as a prefix, e.g. Dim:
 * DimCustomer, dimCustomer, Dim_Customer, Dim Customer, DIM_CUSTOMER, DIMCustomer → yes;
 * Dimonitor, Dimension, DIMONITOR → no. The character after the prefix must not be a
 * lower-case letter; after an all-caps prefix it must be a non-letter, or an upper-case
 * letter followed by a lower-case one.
 * @param {string} name
 * @param {string} word lower-case prefix
 */
function prefixMatch(name, word) {
  const n = String(name || '').trim();
  const p = n.slice(0, word.length);
  if (p.toLowerCase() !== word) return false;
  const rest = n.slice(word.length);
  if (rest === '') return true;
  const c = rest[0];
  if (!/[A-Za-z]/.test(c)) return true;
  const allCaps = p === p.toUpperCase() && /[A-Z]/.test(p) && word.length > 1;
  if (allCaps) return /[A-Z]/.test(c) && /[a-z]/.test(rest[1] || '');
  return /[A-Z]/.test(c);
}

/** Lower-case name without leading symbols and without separators. */
function squash(name) {
  return String(name || '').trim().replace(/^[^A-Za-z0-9]+/, '').toLowerCase().replace(/[\s_\-.]+/g, '');
}

/** Calendar / date table by name (incl. Power BI auto date tables). */
function isCalendarName(name) {
  if (/^(LocalDateTable|DateTableTemplate)_/i.test(String(name || '').trim())) return true;
  return /^(dim|tbl|tabel|table|master)?(date|dates|calendar|calendars|calender|kalender|tanggal|datetime)(table|tabel|tbl|dim)?$/.test(squash(name));
}

/** Table that stores measures, by name. */
function isMeasureTableName(name) {
  const n = squash(name);
  return /^(key|all|my|base|main)?measures?(table|tabel|tbl|group|grp|folder)?$/.test(n)
    || /^(tbl|table|tabel)measures?$/.test(n)
    || /measures$/.test(n);
}

/**
 * @param {{name:string, dataCategory?:string, columns?:{name:string, isHidden?:boolean}[], measureCount?:number}} t
 * @returns {{group:'special'|'fact'|'dim'|'other', reason:string}}
 */
function classifyTable(t) {
  const columns = t.columns || [];
  const measures = t.measureCount || 0;
  if (isCalendarName(t.name) || String(t.dataCategory || '').toLowerCase() === 'time') return { group: 'special', reason: 'kalender' };
  if (isMeasureTableName(t.name)) return { group: 'special', reason: 'tabel measure' };
  // Only measures, no real data columns (none, or a single helper column).
  const helperOnly = columns.length === 0
    || (columns.length === 1 && (columns[0].isHidden || /^(column1|value|dummy|kolom1|blank|helper)$/i.test(columns[0].name)));
  if (measures > 0 && helperOnly) return { group: 'special', reason: 'tabel measure' };
  if (prefixMatch(t.name, 'fact')) return { group: 'fact', reason: '' };
  if (prefixMatch(t.name, 'dim')) return { group: 'dim', reason: '' };
  return { group: 'other', reason: '' };
}

/** Parameter query: Power BI writes `meta [IsParameterQuery = true, …]`. */
function isParameterCode(code) {
  return /\bIsParameterQuery\s*=\s*true\b/i.test(String(code || ''));
}

/** Function query: fn/fx prefix, PBI_ResultType = Function, or code that is a function literal. */
function isFunctionQuery(name, resultType, code) {
  if (prefixMatch(name, 'fn') || prefixMatch(name, 'fx')) return true;
  if (String(resultType || '').toLowerCase() === 'function') return true;
  const c = String(code || '').replace(/\/\*[\s\S]*?\*\//g, '').replace(/\/\/[^\n]*/g, '').trim();
  return /^\([^()]*\)\s*(as\s+[A-Za-z_.]+(\s+nullable)?\s*)?=>/.test(c);
}

/**
 * @param {{kind:'partition'|'expression', name:string, table:string, code?:string, inline?:string, queryGroup?:string, resultType?:string}} q
 * @param {Parameters<typeof classifyTable>[0]=} table info of the owning table (partitions)
 * @returns {{group:string, role:'function'|'parameter'|'', loaded:boolean}}
 */
function classifyQuery(q, table) {
  if (q.kind === 'partition') {
    const t = table || { name: q.table };
    return { group: classifyTable(t).group, role: '', loaded: true };
  }
  const code = q.inline || q.code || '';
  if (isParameterCode(code)) return { group: 'fnparam', role: 'parameter', loaded: false };
  if (isFunctionQuery(q.name, q.resultType, code)) return { group: 'fnparam', role: 'function', loaded: false };
  if (isCalendarName(q.name) || isMeasureTableName(q.name)) return { group: 'special', role: '', loaded: false };
  if (prefixMatch(q.name, 'fact')) return { group: 'fact', role: '', loaded: false };
  if (prefixMatch(q.name, 'dim')) return { group: 'dim', role: '', loaded: false };
  if (prefixMatch(q.name, 'staging') || prefixMatch(q.name, 'stg') || /staging/i.test(q.queryGroup || '')) return { group: 'staging', role: '', loaded: false };
  return { group: 'other', role: '', loaded: false };
}

/**
 * Classification input for a table group of the editor (see items.js TableGroup).
 * @param {{name:string, items:{type:string, name:string, isHidden?:boolean, dataCategory?:string}[]}} g
 */
function tableInfo(g) {
  const t = g.items.find((i) => i.type === 'table');
  return {
    name: g.name,
    dataCategory: t ? t.dataCategory : undefined,
    columns: g.items.filter((i) => i.type === 'column'),
    measureCount: g.items.filter((i) => i.type === 'measure').length,
  };
}

exports.TABLE_GROUPS = TABLE_GROUPS; exports.QUERY_GROUPS = QUERY_GROUPS; exports.prefixMatch = prefixMatch; exports.isCalendarName = isCalendarName; exports.isMeasureTableName = isMeasureTableName; exports.classifyTable = classifyTable; exports.isParameterCode = isParameterCode; exports.isFunctionQuery = isFunctionQuery; exports.classifyQuery = classifyQuery; exports.tableInfo = tableInfo;
});

__def("ui/side-groups.js", function (exports) {
// Collapsible category header for the sidebars (shared by both edit views).

const { h, fmt } = __req("ui/dom.js");

/**
 * @param {{id:string, title:string, count:number, open:boolean, domId:string, onToggle:(open:boolean)=>void}} o
 * @returns {{head:HTMLElement, items:HTMLElement}}
 */
function sideGroup(o) {
  const items = h('div', { class: 'side-group-items', id: o.domId, hidden: !o.open });
  const head = h('button', {
    type: 'button', class: 'side-group', dataset: { group: o.id }, 'aria-expanded': String(o.open), 'aria-controls': o.domId,
  }, h('span', { class: 'side-chevron', 'aria-hidden': 'true', text: '▸' }), h('span', { class: 'side-group-title', text: o.title }),
  h('span', { class: 'side-group-count', text: `(${fmt(o.count)})` }));
  head.addEventListener('click', () => {
    const nowOpen = items.hidden; // toggle without rebuilding the list (keeps the scroll position)
    items.hidden = !nowOpen;
    head.setAttribute('aria-expanded', String(nowOpen));
    o.onToggle(nowOpen);
  });
  return { head, items };
}

exports.sideGroup = sideGroup;
});

 * @property {Map<string, import('../core/items.js').EditorItem>} byKey
 * @property {import('../core/items.js').TableGroup[]} tables
 * @property {Map<string,string>} edits
 * @property {import('./storage.js').Draft|null} draft   draft offered for restore
 * @property {Set<string>} selected
 * @property {Map<string,string>} aiFilled  key → description last written by AI (for the ✨ marker)
 * @property {import('../core/mquery.js').MQuery[]} queries  Power Query queries (m partitions + expressions)
 * @property {Map<string, {key:string, originalDesc:string, editable:boolean}>} mByKey  expressions + steps
 * @property {Map<string, any>} refactors  query key → AI refactor result (session only, never written to TMDL)
 */

/** Editable entries of the Power Query view: expression descriptions and step descriptions. */
function buildMIndex(parsed, queries) {
  const m = new Map();
  for (const o of parsed.objects) {
    if (o.type !== 'expression') continue;
    const prev = m.get(o.key);
    if (!prev || (!prev.editable && o.editable)) m.set(o.key, { key: o.key, originalDesc: o.originalDesc, editable: o.editable });
  }
  for (const q of queries) {
    for (const st of q.steps) m.set(st.key, { key: st.key, originalDesc: st.originalDesc, editable: st.commentable });
  }
  return m;
}

const listeners = new Map();
let nextId = 1;

const app = {
  /** @type {Doc[]} */
  docs: [],
  active: 0,
  /** @type {'input'|'edit'|'output'} */
  step: 'input',
  /** @type {'objects'|'mquery'} */
  editMode: 'objects',
  prefs: storage.loadPrefs(),
  /** shared AI helper (set by the grid) */
  ai: null,

  /** @returns {Doc|null} */
  doc() {
    return this.docs[this.active] || null;
  },

  on(evt, fn) {
    if (!listeners.has(evt)) listeners.set(evt, []);
    listeners.get(evt).push(fn);
  },

  emit(evt, payload) {
    for (const fn of listeners.get(evt) || []) fn(payload);
  },

  /**
   * Parse new sources and replace the current documents.
   * @param {{name:string, text:string, fromFile:boolean}[]} sources
   */
  loadDocs(sources) {
    saveNow.flush();
    this.docs = sources.map((s) => {
      const parsed = parseTmdl(s.text);
      const { items, byKey, tables } = buildItems(parsed);
      const queries = collectQueries(parsed);
      const hash = hashText(s.text);
      return {
        id: nextId++,
        name: s.name,
        fromFile: s.fromFile,
        text: s.text,
        hash,
        parsed,
        items,
        byKey,
        tables,
        edits: new Map(),
        draft: storage.loadDraft(hash),
        selected: new Set(),
        aiFilled: new Map(),
        queries,
        mByKey: buildMIndex(parsed, queries),
        refactors: new Map(),
      };
    });
    this.active = 0;
    this.emit('docs');
    this.updateChrome();
  },

  setActive(i) {
    if (i === this.active || !this.docs[i]) return;
    saveNow.flush();
    this.active = i;
    this.emit('active');
    this.updateChrome();
  },

  /** Any editable entry (object item, expression or step) by key. */
  entry(key, doc = this.doc()) {
    return doc.byKey.get(key) || doc.mByKey.get(key) || null;
  },

  setEditMode(mode) {
    if (mode === this.editMode) return;
    this.editMode = mode;
    this.emit('editmode', mode);
  },

  /** Current description text for an item of the active doc. */
  desc(item, doc = this.doc()) {
    return currentDescription(item, doc.edits);
  },

  /**
   * Record an edit. Values equal to the original are dropped from the map.
   * @param {string} key
   * @param {string} value
   * @param {{silent?:boolean}} [opt]
   */
  setDesc(key, value, opt = {}, doc = this.doc()) {
    const item = this.entry(key, doc);
    if (!item || !item.editable) return;
    if (doc.draft) {
      // Editing without restoring = starting fresh; the old draft will be overwritten.
      doc.draft = null;
      this.emit('draft', doc);
    }
    if (normalizeDescription(value) === normalizeDescription(item.originalDesc)) doc.edits.delete(key);
    else doc.edits.set(key, value);
    saveNow();
    if (!opt.silent) this.emit('edit', key);
    this.updateProgress();
  },

  /** Apply many edits at once (Excel import, AI fill, bulk fill, replace). */
  setMany(pairs, doc = this.doc()) {
    for (const [k, v] of pairs) this.setDesc(k, v, { silent: true }, doc);
    this.emit('bulk');
    this.updateProgress();
  },

  restoreDraft(doc) {
    const draft = doc.draft;
    if (!draft) return 0;
    doc.draft = null;
    let n = 0;
    for (const [k, v] of draft.edits) {
      const item = this.entry(k, doc);
      if (item && item.editable) {
        this.setDesc(k, v, { silent: true }, doc);
        n++;
      }
    }
    this.emit('draft', doc);
    this.emit('bulk');
    this.updateProgress();
    return n;
  },

  discardDraft(doc) {
    if (doc.draft) storage.deleteDraft(doc.hash);
    doc.draft = null;
    this.emit('draft', doc);
  },

  savePrefs(patch) {
    Object.assign(this.prefs, patch);
    storage.savePrefs(patch);
  },

  goto(step) {
    if (step !== 'input' && !this.doc()) return;
    this.step = step;
    for (const s of ['input', 'edit', 'output']) {
      const tab = $('#tab-' + s);
      const panel = $('#panel-' + s);
      tab.setAttribute('aria-selected', String(s === step));
      tab.classList.toggle('active', s === step);
      panel.hidden = s !== step;
    }
    this.emit('step', step);
    window.scrollTo(0, 0);
  },

  updateChrome() {
    const has = this.docs.length > 0;
    $('#tab-edit').disabled = !has;
    $('#tab-output').disabled = !has;
    const sw = $('#doc-switch');
    const sel = /** @type {HTMLSelectElement} */ ($('#doc-select'));
    sw.hidden = this.docs.length < 2;
    sel.textContent = '';
    this.docs.forEach((d, i) => {
      const o = document.createElement('option');
      o.value = String(i);
      o.textContent = d.name;
      o.selected = i === this.active;
      sel.append(o);
    });
    this.updateProgress();
  },

  updateProgress() {
    const doc = this.doc();
    const box = $('#progress-total');
    if (!doc) {
      box.hidden = true;
      return;
    }
    const p = progress(doc.items, doc.edits);
    box.hidden = false;
    const pct = p.total ? Math.floor((p.filled / p.total) * 100) : 0; // floor: 100% only when complete
    $('#progress-fill').style.width = pct + '%';
    $('#progress-text').textContent = `${fmt(p.filled)}/${fmt(p.total)} (${pct}%) terisi · ${fmt(p.changed)} diubah`;
    box.title = `${pct}% objek yang bisa diedit sudah punya deskripsi`;
  },
};

// Autosave (debounced 500 ms) for every doc with a pending change.
const saveNow = debounce(() => {
  for (const d of app.docs) {
    if (d.draft) continue; // don't overwrite an unrestored draft with an empty edit set
    storage.saveDraft(d.hash, d.name, d.edits);
  }
}, 500);
window.addEventListener('beforeunload', () => saveNow.flush());

function boot() {
  for (const s of ['input', 'edit', 'output']) {
    $('#tab-' + s).addEventListener('click', () => app.goto(/** @type {any} */ (s)));
  }
  $('#doc-select').addEventListener('change', (e) => app.setActive(Number(/** @type {HTMLSelectElement} */ (e.target).value)));
  initInput(app, $('#panel-input'));
  const editPanel = $('#panel-edit');
  const modeBar = h('div', { class: 'mode-bar', role: 'tablist', 'aria-label': 'Jenis deskripsi' },
    h('button', { type: 'button', class: 'mode-btn active', role: 'tab', id: 'mode-objects', dataset: { mode: 'objects' }, text: 'Tabel, kolom & measure' }),
    h('button', { type: 'button', class: 'mode-btn', role: 'tab', id: 'mode-mquery', dataset: { mode: 'mquery' } }, 'Power Query (M) ', h('span', { class: 'mode-count', id: 'mode-mquery-count' })));
  const gridRoot = h('div', { id: 'objects-root' });
  const mRoot = h('div', { id: 'mquery-root', hidden: true });
  editPanel.append(modeBar, gridRoot, mRoot);
  modeBar.addEventListener('click', (e) => {
    const b = /** @type {HTMLElement} */ (e.target).closest('.mode-btn');
    if (b) app.setEditMode(/** @type {any} */ (b.dataset.mode));
  });
  app.on('editmode', (mode) => {
    for (const b of modeBar.querySelectorAll('.mode-btn')) {
      const on = /** @type {HTMLElement} */ (b).dataset.mode === mode;
      b.classList.toggle('active', on);
      b.setAttribute('aria-selected', String(on));
    }
    gridRoot.hidden = mode !== 'objects';
    mRoot.hidden = mode !== 'mquery';
  });
  const updateMCount = () => {
    const d = app.doc();
    const n = d ? d.queries.length : 0;
    $('#mode-mquery-count').textContent = n ? `(${fmt(n)} query)` : '(tidak ada)';
  };
  app.on('docs', updateMCount);
  app.on('active', updateMCount);
  initGrid(app, gridRoot);
  initMPanel(app, mRoot);
  initOutput(app, $('#panel-output'));
  app.goto('input');
  app.updateChrome();
}

if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', boot);
else boot();
